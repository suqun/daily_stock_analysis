# 涨停跟踪低吸策略配置（优化版）
name: limit_up_track_dip
display_name: 涨停跟踪低吸
description: 聚焦热门板块涨停股，自动入自选+动态分组，定时3-7天缩量下跌筛选，地量下影线+均线突破双买点触发通知，超10天未收复涨停价强制出局（优化版：降低门槛+明确量化）
category: reversal
core_rules: [2,5]
required_tools:
  - get_daily_history
  - get_realtime_quote
  - get_sector_rankings
aliases: [涨停低吸,热门板块涨停跟踪]
default_priority: 60
market_regimes: [trending_up,sideways]
# 新增：量化指标定义（关键！）
quant_rules:
  # 热门板块判定：行业涨幅排名前30% 或 涨停数前20%
  hot_sector_top: 30
  # 缩量下跌判定：当日成交量 < 涨停日成交量的70% 且 跌幅≤3%（小幅下跌）
  shrink_volume_ratio: 0.7
  max_drop_pct: 3.0
  # 地量判定：成交量 < 近5日均量的50%
  ground_volume_ratio: 0.5
  # 长下影线判定：下影线长度 ≥ 实体部分的1.5倍 且 下影线≥1%
  lower_shadow_ratio: 1.5
  min_lower_shadow_pct: 1.0
  # 均线判定：股价未跌破10日线（偏差≤2%），突破5日线（涨幅≥0.5%）
  ma10_deviation: 2.0
  ma5_break_pct: 0.5
instructions: |
  1. 标的纳入与分组（降低门槛）
     当日有效涨停个股，优先加入自选股池；自动归入首板涨停组、两板涨停组；
     热门板块校验改为「可选」：热门板块标的加分优先，非热门板块也可入池（仅不加分），避免直接过滤。
  2. 定时观察筛选（明确量化+放宽周期）
     对入池标的跟踪3-7个交易日，缩量下跌判定：
     - 当日成交量 < 涨停日成交量的70% 
     - 当日跌幅≤3%（小幅缩量回调，非放量大跌）
     放量下跌（成交量>涨停日120%）才剔除，其余保留观察。
  3. 买点判定与通知（明确量化）
     基础买点：筛选后标的出现「地量（<5日均量50%）+ 长下影线（下影线≥实体1.5倍且≥1%）」，标记买点并推送；
     核心买点：涨停后股价未跌破10日线（偏差≤2%）+ 放量突破5日线（涨幅≥0.5%），高优先级推送。
  4. 持仓持有（新增容错）
     入场后缩量小阴小阳（跌幅≤1%/涨幅≤2%）判定为安全持仓，继续持有；
     若跌破10日线但≤5%，暂不卖出，观察1个交易日。
  5. 强制出局（放宽期限）
     涨停后超过10个交易日未收复涨停价，触发出局提醒，自动移出自选和分组。
  评分调整（降低加分门槛）：
  - 热门板块涨停入组：sentiment_score +2（原+3）
  - 缩量下跌筛选通过：sentiment_score +3（原+5）
  - 基础买点触发：sentiment_score +5（原+7）
  - 核心买点触发：sentiment_score +8（原+10）
  - 超10天未收复涨停价：sentiment_score -10（原-15，减少扣分）
  结果标注：
  - 买点触发：buy_reason标注“热门板块涨停-基础买点/核心买点”
  - 分组归类：pattern_analysis标注“首板涨停标的/两板涨停标的”
  - 出局触发：sell_reason标注“涨停后超10天未收复涨停价”