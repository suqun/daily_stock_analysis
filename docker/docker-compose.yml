# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================
# 
# 使用方式:
#   cd /volume1/docker/stock
#   docker compose -f daily_stock_analysis/docker/docker-compose.yml up -d --build
#
# NAS目录结构:
#   /volume1/docker/stock/
#   ├── daily_stock_analysis/  # 代码
#   │   ├── .env              # 环境配置
#   │   ├── data/             # 数据目录
#   │   ├── logs/             # 日志目录
#   │   └── ...
#   ├── data/                 # 共享数据
#   ├── logs/                 # 共享日志
#   └── reports/              # 共享报告

name: daily-stock-analysis

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  # 环境变量
  env_file:
    - ../.env

  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../.env:/app/.env:ro
    - ../strategies:/app/strategies:ro
    - ../data/zsxq:/app/data/zsxq

  environment:
    - TZ=Asia/Shanghai
    - WEBUI_HOST=0.0.0.0

  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Web服务 + 定时分析
  server:
    <<: *common
    container_name: stock-server
    command: ["python", "main.py", "--webui", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      - SCHEDULE_ENABLED=true
      - SCHEDULE_TIME=18:00
      - SCHEDULE_RUN_IMMEDIATELY=true
      - RUN_IMMEDIATELY=true
      - MARKET_REVIEW_ENABLED=true
    deploy:
      resources:
        limits:
          memory: 1G

  # 知识星球会员同步定时任务
  zsxq:
    <<: *common
    container_name: stock-zsxq
    command: ["python", "zsxq_scheduler.py"]
    environment:
      - ZSXQ_SYNC_INTERVAL=10
    deploy:
      resources:
        limits:
          memory: 256M

  # QQ 机器人 OpenClaw —— 适配 Node22-slim + 解决重启循环 + 日志可见
  openclaw:
    image: node:22-slim  # 固定使用node22-slim
    container_name: stock-openclaw
    restart: unless-stopped
    ports:
      - "18789:18789"
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
      # 解决Node22兼容性：禁用实验性警告、兼容旧API
      - NODE_OPTIONS=--no-experimental-fetch --openssl-legacy-provider
    env_file:
      - ../.env
    volumes:
      - ../data:/data
      - ../logs:/logs  # 确保宿主机../logs目录存在
    working_dir: /app
    # 核心修复：1. 安装兼容Node22的依赖 2. 前台运行进程 3. 日志重定向
    command: >
      sh -c "
      # 更新apt源+安装基础依赖（slim版缺少gcc等编译工具）
      apt update && apt install -y --no-install-recommends procps &&
      # 切换国内npm源，加速安装
      npm config set registry https://registry.npmmirror.com &&
      # 强制安装适配Node22的forever和openclaw-gateway
      npm install -g forever openclaw-gateway --force &&
      # 前台运行openclaw，日志写入挂载目录
      forever -o /logs/openclaw-out.log -e /logs/openclaw-err.log -f start `which openclaw`
      "
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G