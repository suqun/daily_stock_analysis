# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================
# 
# 使用方式:
#   cd /volume1/docker/stock
#   docker compose -f daily_stock_analysis/docker/docker-compose.yml up -d --build
#
# NAS目录结构:
#   /volume1/docker/stock/
#   ├── daily_stock_analysis/  # 代码
#   │   ├── .env              # 环境配置
#   │   ├── data/             # 数据目录
#   │   ├── logs/             # 日志目录
#   │   └── ...
#   ├── data/                 # 共享数据
#   ├── logs/                 # 共享日志
#   └── reports/              # 共享报告

name: daily-stock-analysis

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  # 环境变量
  env_file:
    - ../.env

  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../.env:/app/.env:ro
    - ../strategies:/app/strategies:ro
    - ../data/zsxq:/app/data/zsxq

  environment:
    - TZ=Asia/Shanghai
    - WEBUI_HOST=0.0.0.0

  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Web服务 + 定时分析
  server:
    <<: *common
    container_name: stock-server
    command: ["python", "main.py", "--webui", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      - SCHEDULE_ENABLED=true
      - SCHEDULE_TIME=18:00
      - SCHEDULE_RUN_IMMEDIATELY=true
      - RUN_IMMEDIATELY=true
      - MARKET_REVIEW_ENABLED=true
    deploy:
      resources:
        limits:
          memory: 1G

  # 知识星球会员同步定时任务
  zsxq:
    <<: *common
    container_name: stock-zsxq
    command: ["python", "zsxq_scheduler.py"]
    environment:
      - ZSXQ_SYNC_INTERVAL=10
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================
  # QQ 机器人 - 需要单独部署 NapCat
  # 详见: https://github.com/tencent-connect/NapCat
  # ===========================================
  # 
  # 由于 OpenClaw 已停止维护，QQ 机器人需要单独部署：
  #
  # 方案1: NapCat.Docker (推荐)
  #   1. 安装 Docker 版 NapCat
  #   2. 配置 .env 中的 QQ_BOT_* 配置
  #
  # 方案2: 手动部署
  #   在 NAS 上单独部署 NapCat，配置 Webhook 指向 stock-server
